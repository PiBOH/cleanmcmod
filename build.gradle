plugins {
    // Minecraft 26.1 and newer ship unobfuscated, so this branch uses Loom's
    // non-remapping plugin: no mappings, no remap step, official class names.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Support matrix. Pass -Pmc=<version> to build the same source tree for another
// 26.x release; without it the defaults in gradle.properties are used.
// Every row states the exact Fabric API build, Mod Menu build and Minecraft
// dependency range that version needs. Add a row only after that combination
// has actually compiled.
def targets = [
        '26.1': [api: '0.145.1+26.1', menu: '18.0.2', dep: '>=26.1 <26.2'],
        '26.2': [api: '0.161.0+26.2', menu: '20.0.3', dep: '>=26.2 <26.3'],
        '26.3': [api: '0.165.0+26.3', menu: '21.0.0', dep: '>=26.3 <26.4'],
]

// An explicit -P<name>=... always wins over the selected row.
def cli = gradle.startParameter.projectProperties
def target = cli['mc'] ? targets[cli['mc']] : null
if (cli['mc'] && target == null) {
    throw new GradleException("-Pmc=${cli['mc']} is not a supported target. Supported: ${targets.keySet().join(', ')}")
}

def mcVersion = cli['mc'] ?: minecraft_version
def fabricApiVersion = cli['fabric_api_version'] ?: (target?.api ?: fabric_api_version)
def mcDep = cli['minecraft_dep'] ?: (target?.dep ?: minecraft_dep)
// Mod Menu is optional at runtime; only its API is needed at compile time.
def modMenuVersion = cli['modmenu_version'] ?: (target?.menu ?: modmenu_version)

// version.txt is the single source of truth for the mod version.
def modVersion = rootProject.file('version.txt').text.trim()
version = "${modVersion}+${mcVersion}"
group = 'piboh.cleanmc.mod'

base {
    archivesName = 'cleanmcmod'
}

repositories {
    mavenCentral()
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    // No mappings on 26.x: the loader, Fabric API and Mod Menu jars are all
    // compiled against the same official names as the game itself.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    compileOnly "com.terraformersmc:modmenu:${modMenuVersion}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    // 26.x targets Java 25; Loom's own build also runs on a JDK 25.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', modVersion
    inputs.property 'minecraft_dep', mcDep
    filesMatching('fabric.mod.json') {
        expand version: modVersion, minecraft_dep: mcDep
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_cleanmcmod" }
    }
}
