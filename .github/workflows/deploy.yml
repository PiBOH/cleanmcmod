name: Deploy website

# The site lives on this branch only. Pushing here publishes .website/ through
# GitHub Pages; the repository setting must be Settings -> Pages -> Source:
# GitHub Actions, which is what actions/deploy-pages requires.
on:
  push:
    branches: ['github-pages']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Assemble the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Check the pages are complete
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html install.html versions.html 404.html styles.css script.js icon.png .nojekyll; do
            test -f ".website/$f" || { echo "missing .website/$f"; exit 1; }
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .website

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
