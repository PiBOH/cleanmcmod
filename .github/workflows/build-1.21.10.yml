name: Build 1.21.10

# One workflow per Minecraft target. The source tree is shared and
# build.gradle picks the Yarn, Fabric API and Java versions with -Pmc; every
# row in that file has been compiled locally before this workflow was added.
on:
  push:
    branches: ['1.21.10']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-1.21.10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build.gradle pins a Java 21 toolchain and no toolchain download
      # repositories are configured, so a JDK 21 must actually be installed;
      # setup-java exports its path and the next step sets JAVA_HOME to 25.
      - name: Set up JDK 21 (compile and test toolchain)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Loom 1.19.3 refuses to run on JVM 21: Gradle and Loom need JDK 25.
      - name: Set up JDK 25 (Gradle and Loom)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test 1.21.10
        run: >
          ./gradlew clean build --no-daemon --stacktrace -Pmc=1.21.10
          -Porg.gradle.java.installations.paths="${JAVA_HOME_21_X64:-$JAVA_HOME}"

      - uses: actions/upload-artifact@v4
        with:
          name: cleanmcmod-1.21.10
          path: build/libs/cleanmcmod-*.jar
          if-no-files-found: error

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-1.21.10
          path: build/reports/tests/test
          if-no-files-found: ignore
