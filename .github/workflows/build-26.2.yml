name: Build 26.2

# One workflow per Minecraft target. The source tree is shared and build.gradle
# picks the Fabric API and Mod Menu builds with -Pmc; every row in that file has
# been compiled locally before this workflow was added. 26.x is unobfuscated and
# needs JDK 25 only: same JVM for Gradle, Loom and the Java 25 release level.
on:
  push:
    branches: ['26.2']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-26.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle, Loom and toolchain)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test 26.2
        run: ./gradlew clean build --no-daemon --stacktrace -Pmc=26.2

      - uses: actions/upload-artifact@v4
        with:
          name: cleanmcmod-26.2
          path: build/libs/cleanmcmod-*.jar
          if-no-files-found: error

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-26.2
          path: build/reports/tests/test
          if-no-files-found: ignore
