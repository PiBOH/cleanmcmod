# Defaults for the 26.3 target. Build another supported version with
# ./gradlew build -Pmc=26.1 (see the support matrix in build.gradle).
# Supported on this line: 26.1, 26.2, 26.3 — all Java 25, all unobfuscated,
# so there are no Yarn mappings and no remap step.
minecraft_version=26.3
loader_version=0.20.1
fabric_api_version=0.165.0+26.3
# Range written into fabric.mod.json (keep in sync with minecraft_version).
minecraft_dep=>=26.3 <26.4
loom_version=1.19-SNAPSHOT
# Optional at runtime: only the ModMenu API is compiled against.
modmenu_version=21.0.0

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
