# Defaults for the 1.21.10 target. Build another supported version with
# ./gradlew build -Pmc=1.21.11 (see the support matrix in build.gradle).
# Supported: 1.21.8, 1.21.9, 1.21.10, 1.21.11 — all Java 21.
minecraft_version=1.21.10
yarn_mappings=1.21.10+build.3
loader_version=0.20.1
fabric_api_version=0.138.4+1.21.10
# Range written into fabric.mod.json (keep in sync with minecraft_version).
minecraft_dep=>=1.21.10 <1.21.12
java_version=21
loom_version=1.19.3
# Optional at runtime: only the ModMenu API is compiled against.
modmenu_version=16.0.1

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
